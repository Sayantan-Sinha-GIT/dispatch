name: Android APK

# Manual only. The APK does not need rebuilding on every commit — only when
# the web manifest, the icons or the version in android-twa/twa-manifest.json
# actually change.
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "appVersionCode (must increase for every Play upload)"
        required: false
        default: "1"
      versionName:
        description: "appVersionName shown to users"
        required: false
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # The runner image ships an Android SDK, so no setup action is needed
      # (android-actions/setup-android@v3 tries to install the long-removed
      # "tools" package and fails). The command-line tools live under a
      # versioned folder such as cmdline-tools/16.0, but Bubblewrap only looks
      # for them at <sdk>/bin, so link whichever version is present.
      - name: Lay out the SDK the way Bubblewrap expects
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          TOOLS=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/ | sort -V | tail -1)
          echo "Using command-line tools at $TOOLS"
          ln -sfn "${TOOLS}bin" "$ANDROID_HOME/bin"
          ln -sfn "${TOOLS}lib" "$ANDROID_HOME/lib"
          yes | "$ANDROID_HOME/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/bin/sdkmanager" "build-tools;36.1.0" "platforms;android-36" "platform-tools"

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          bubblewrap doctor

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See android-twa/README.md."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android-twa/android.keystore

      - name: Apply the requested version
        working-directory: android-twa
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.appVersionCode = Number(process.env.VERSION_CODE);
            m.appVersionName = process.env.VERSION_NAME;
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2) + "\n");
          '
        env:
          VERSION_CODE: ${{ github.event.inputs.versionCode }}
          VERSION_NAME: ${{ github.event.inputs.versionName }}

      - name: Build
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation

      # This is the value that has to go into public/.well-known/assetlinks.json.
      # Until it does, the app opens with a browser URL bar across the top.
      - name: Print the signing fingerprint
        working-directory: android-twa
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore android.keystore -alias android \
            -storepass "$STOREPASS" | grep -A1 "SHA256:" | tee fingerprint.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-apk
          path: |
            android-twa/app-release-signed.apk
            android-twa/app-release-bundle.aab
            android-twa/fingerprint.txt
          if-no-files-found: error
