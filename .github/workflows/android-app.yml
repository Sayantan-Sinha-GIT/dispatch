name: Android app

# Builds the Capacitor app in android-app/ into a signed APK. Manual only: the
# app loads the live site, so it needs rebuilding only when the native shell
# changes (plugins, icons, permissions, version), not for website updates.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"  # Capacitor 8 needs 21

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Install and copy the plugins into the Android project
        run: |
          npm ci
          npx cap sync android

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dispatch.keystore"

      - name: Build the release APK
        working-directory: android-app/android
        env:
          DISPATCH_KEYSTORE: ${{ runner.temp }}/dispatch.keystore
          DISPATCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DISPATCH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      # The app must be signed with the same key as every earlier build, or
      # phones refuse to install it over the old one, and Google sign-in (which
      # is registered to this key's SHA-1) stops working.
      - name: Check the signature and name the file
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -qi "SHA-256 digest: cf809e22c634b1b778f246b86a4c0b0539e4398122956a0f3b766f7f40022fbc" certs.txt \
            || { echo "::error::APK is not signed with the Dispatch key"; exit 1; }
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          mkdir -p out && cp "$APK" "out/Dispatch-$VERSION.apk"
          echo "Built Dispatch-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-android
          path: android-app/out/*.apk
